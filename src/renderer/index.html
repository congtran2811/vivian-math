<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vivian Math</title>
    <style>
      /* Màn hình chờ lúc mở phần mềm; React thay nội dung #root khi nạp xong. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f4f6fb; color: #1f2a5c; font: 600 16px system-ui, 'Segoe UI', sans-serif; }
      .boot-spinner { width: 44px; height: 44px; border: 4px solid #cdd5f7; border-top-color: #2b4eff; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-spinner"></div>
        <div>Đang mở Vivian Math…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
